<svg xmlns="http://www.w3.org/2000/svg" width="550" height="240" viewBox="0 0 550 240">
<defs><style>:root {
  --color-bg-primary: #121417;
  --color-bg-secondary: #1b1f24;
  --color-bg-tertiary: #242a31;
  --color-text-primary: #e6e6e6;
  --color-text-secondary: #7b8794;
  --color-text-tertiary: #6b7280;
  --color-border: #2a323a;
  --color-border-light: #2a323a;
  --color-accent: #2dd4bf;
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
  --font-sans: Inter, system-ui, sans-serif;
  --font-mono: "JetBrains Mono", monospace;
}
body {
  font-family: var(--font-sans);
  color: var(--color-text-primary);
  background: transparent;
  margin: 0; padding: 0;
}
.t { font-family: var(--font-sans); font-size: 14px; fill: var(--color-text-primary); }
.ts { font-family: var(--font-sans); font-size: 12px; fill: var(--color-text-secondary); }
.th { font-family: var(--font-sans); font-size: 14px; font-weight: 500; fill: var(--color-text-primary); }
.box { fill: var(--color-bg-secondary); stroke: var(--color-border); stroke-width: 0.5; }
.arr { stroke: var(--color-text-secondary); stroke-width: 1.5; fill: none; }
.node { cursor: pointer; }
